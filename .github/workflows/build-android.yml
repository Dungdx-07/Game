name: Build Infinite Evolution 2.0 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Infinite_Evolution_2_0_Polished_Project.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  android-apk:
    name: Export Android ARM64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Unpack Godot project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f Infinite_Evolution_2_0_Polished_Project.zip || {
            echo "Missing Infinite_Evolution_2_0_Polished_Project.zip in repository root." >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/ie-source"
          unzip -q Infinite_Evolution_2_0_Polished_Project.zip -d "$RUNNER_TEMP/ie-source"
          PROJECT_DIR="$RUNNER_TEMP/ie-source/Infinite_Evolution_2_0_Godot"
          test -f "$PROJECT_DIR/project.godot" || {
            echo "project.godot was not found after extraction. Confirm you uploaded the original Polished_Project ZIP." >&2
            find "$RUNNER_TEMP/ie-source" -maxdepth 3 -type f | head -80
            exit 1
          }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project extracted successfully."

      - name: Download Godot 4.7.2 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl -fL --retry 3 --retry-delay 2 "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl -fL --retry 3 --retry-delay 2 "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot-templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-bin" "$RUNNER_TEMP/godot-template-extract"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          GODOT="$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          test -f "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-template-extract"
          TEMPLATE_SOURCE="$RUNNER_TEMP/godot-template-extract/templates"
          if [ ! -d "$TEMPLATE_SOURCE" ]; then
            TEMPLATE_SOURCE="$(find "$RUNNER_TEMP/godot-template-extract" -type f -name android_debug.apk -printf '%h\n' -quit)"
          fi
          test -n "$TEMPLATE_SOURCE" && test -f "$TEMPLATE_SOURCE/android_debug.apk"
          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DEST"
          cp -a "$TEMPLATE_SOURCE/." "$TEMPLATE_DEST/"
          printf '4.7.2.stable\n' > "$TEMPLATE_DEST/version.txt"
          "$GODOT" --version

      - name: Run static project checks
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/QA/static_preflight.py"

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --quit

      - name: Prepare temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Export APK for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore" \
          GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey" \
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android" \
            "$GODOT_BIN" --headless --path "$PROJECT_DIR" \
              --export-debug "Android ARM64" \
              "$GITHUB_WORKSPACE/build/Infinite_Evolution_2_0-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/Infinite_Evolution_2_0-debug.apk"
          file "$GITHUB_WORKSPACE/build/Infinite_Evolution_2_0-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/build/Infinite_Evolution_2_0-debug.apk" | tee "$GITHUB_WORKSPACE/build/SHA256SUMS.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Infinite-Evolution-2.0-Android-ARM64-APK
          path: build/
          if-no-files-found: error
          retention-days: 7
          
